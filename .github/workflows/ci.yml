name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The domain tests are pure and need no database, but the Prisma client
      # must exist for the API layer to typecheck.
      - run: npx prisma generate

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

  # Guards against a secret reaching the history. Cheap, and the alternative is
  # rotating credentials under pressure.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for committed .env files
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example'; then
            echo "::error::A .env file is tracked by git. Remove it and rotate every secret it contained."
            exit 1
          fi
